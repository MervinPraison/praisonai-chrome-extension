name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Check out shared theme
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/praisonai-docs-theme
          ssh-key: ${{ secrets.PRAISONAI_THEME_DEPLOY_KEY }}
          persist-credentials: false
          path: .praisonai-theme

      - name: Install shared theme
        run: pip install ./.praisonai-theme

      - name: Build docs
        env:
          PRAISONAI_THEME: praisonai
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
