# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
schemaVersion: 1
site:
  title: PraisonAI Browser Agent
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
seo:
  siteUrl: https://chrome.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      icon: rocket
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/quick-start
      icon: rocket
      prefix: getting-started
    - group: Features
      pages:
      - features/cdp-automation
      - features/side-panel
      - features/screenshots
      - features/page-data
      icon: book-open
      prefix: features
    - group: Architecture
      pages:
      - architecture/overview
      - architecture/cdp-client
      icon: book-open
      prefix: architecture
    - group: Reference
      pages:
      - side-panel-api
      - manifest-reference
      - privacy
      - removed-features
      icon: terminal
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/praisonai-chrome-extension
footer:
  socials:
    github: https://github.com/MervinPraison/praisonai-chrome-extension
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI Browser Agent
  footer_main:
    type: Footer
    props:
      text: Original site design © 2026 Mervin Praison. All rights reserved. Third-party
        components retain their respective licenses.
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
