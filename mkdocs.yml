site_name: PraisonAI Browser Agent
site_url: https://chrome.praison.ai
repo_url: https://github.com/MervinPraison/praisonai-chrome-extension
repo_name: praisonai-chrome-extension

theme:
  name: material
  palette:
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Features:
    - Browser Actions: features/cdp-automation.md
    - Side Panel: features/side-panel.md
    - Screenshots: features/screenshots.md
    - Page Data & Console: features/page-data.md
  - Architecture:
    - Overview: architecture/overview.md
    - CDP Client: architecture/cdp-client.md
  - Reference:
    - Message Reference: side-panel-api.md
    - Manifest & Permissions: manifest-reference.md
    - Privacy: privacy.md
    - Removed in 1.0.4: removed-features.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - tables

plugins:
  - search
